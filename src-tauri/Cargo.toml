[package]
name = "rustium"
version = "0.1.0"
description = "RUSTIUM - a modern Rust-powered desktop web browser"
authors = ["RUSTIUM Contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "rustium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
url = { version = "2", features = ["serde"] }
thiserror = "2"
directories = "6"
parking_lot = "0.12"
futures-util = "0.3"
sanitize-filename = "0.6"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
